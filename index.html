<!doctype html>
<html lang="en" class="h-full select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Remix Arena Strike 3D - Mobile Survival Shooter</title>
    <meta name="description" content="A high-performance mobile-optimized 3D battle royale arena shooter built with Three.js and Tailwind CSS featuring touch virtual joystick, camera orbit, low-poly bots, and audio." />
    <meta property="og:title" content="Remix Arena Strike 3D - Mobile Survival Shooter" />
    <meta property="og:description" content="A high-performance mobile-optimized 3D battle royale arena shooter built with Three.js and Tailwind CSS featuring touch virtual joystick, camera orbit, low-poly bots, and audio." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/app-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/app-logo.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArenaStrike" />

    <!-- Google Fonts for Tactical Battle Royale Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest">

    <style>
      * {
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #000000;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }

      /* Rotate Device Overlay for Portrait view */
      #rotate-notice {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000000;
        color: #ffffff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-family: 'Chakra Petch', sans-serif;
      }
      @media screen and (orientation: portrait) {
        #rotate-notice {
          display: flex;
        }
      }
    </style>
  </head>
  <body class="h-full bg-black text-white font-sans overflow-hidden select-none">
    <div id="rotate-notice">
      <div class="text-5xl mb-4 animate-bounce">📱 🔄 💻</div>
      <h1 class="text-2xl font-bold uppercase tracking-wider text-amber-400 mb-2">Please Rotate Your Device</h1>
      <p class="text-sm text-slate-400 max-w-xs">Arena Strike is designed for immersive landscape tactical gameplay.</p>
    </div>
    <div id="root"></div>
    <script>
      // Attempt to lock screen orientation to landscape
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
