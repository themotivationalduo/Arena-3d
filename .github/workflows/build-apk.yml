name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Android TWA APK
        run: |
          mkdir -p .bubblewrap
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.arenastrike.app",
            "host": "arenastrike.app",
            "name": "Arena Strike 3D",
            "launcherName": "ArenaStrike",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/placeholder/main/public/app-logo.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/placeholder/main/public/pwa-maskable-512x512.png",
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "orientation": "sensorLandscape",
            "display": "standalone"
          }
          EOF
          echo "TWA Manifest and Android icon configuration ready"

      - name: Upload Web Build & APK Assets
        uses: actions/upload-artifact@v4
        with:
          name: arena-strike-dist
          path: |
            dist/
            android/app/src/main/res/
            public/app-logo.png
